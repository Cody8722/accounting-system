version: '3.8'

# 測試環境（develop 分支，接 accounting_db_test）。與正式環境完全獨立的容器（-test 後綴）。
# 經外部 edge 網路，由獨立的 proxy 以 /test/ 前綴分流到這裡（proxy 剝掉 /test 再轉入）。
# 不對外開 host port（只經 proxy 存取），也不含 mongo/proxy。
#
# 部署（測試 checkout ~/accounting-system-test）：
#   docker network create edge   # 若尚未建立（與正式共用）
#   根目錄 .env 設 MONGO_URI=...accounting_db_test
#   docker compose -f docker-compose.test.yml up -d

services:
  backend-test:
    build: ./backend
    container_name: accounting-backend-test
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI:?請在根目錄 .env 設定 MONGO_URI（測試庫 accounting_db_test）}
      - PORT=8080
      - TESTING=false
    volumes:
      - ./backend:/app
    networks:
      - test-network
      - shared-db
      - edge
    command: python main.py

  frontend-test:
    image: nginx:alpine
    container_name: accounting-frontend-test
    restart: unless-stopped
    volumes:
      - ./frontend/v2:/usr/share/nginx/html:ro    # /test/ 根目錄直接服務 v2（/test 即現在的 /test/v2）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-test
    networks:
      - test-network
      - edge

networks:
  test-network:
    driver: bridge
  shared-db:
    external: true
  edge:
    external: true

version: '3.8'

# 正式環境（release 分支，接 accounting_db）。
# MongoDB 用「現有的 mongodb 容器」（外部 shared-db 網路）；MONGO_URI 由根目錄 .env 提供（見 .env.example）。
# HTTPS 反向代理獨立於 docker-compose.proxy.yml（不在此檔），前後端經外部 edge 網路讓 proxy 解析容器名。
#
# 部署（正式 checkout ~/accounting-system-prod）：
#   docker network create edge   # 若尚未建立（與測試環境共用）
#   docker compose up -d
#   docker compose -f docker-compose.proxy.yml up -d

services:
  # 後端服務（Flask / gunicorn）
  backend:
    build: ./backend
    container_name: accounting-backend
    environment:
      - MONGO_URI=${MONGO_URI:?請在根目錄 .env 設定 MONGO_URI（正式庫 accounting_db）}
      - PORT=8080
      - TESTING=false
      # JWT_SECRET / SMTP / 密碼政策等，由掛載的 backend/.env 提供（load_dotenv 讀取）
    volumes:
      - ./backend:/app
    networks:
      - accounting-network    # 與 frontend 互通
      - shared-db             # 連到現有 mongodb 容器
      - edge                  # 讓獨立的 proxy 解析得到此容器
    command: python main.py

  # 前端服務（靜態文件服務器）
  frontend:
    image: nginx:alpine
    container_name: accounting-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - accounting-network
      - edge

networks:
  accounting-network:
    driver: bridge
  # 現有 MongoDB 容器所在的外部網路
  shared-db:
    external: true
  # 與 proxy / 測試環境共用的外部網路（需先建立：docker network create edge）
  edge:
    external: true

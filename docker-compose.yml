version: '3.8'

# MongoDB 不在此 compose 內：使用「現有的 mongodb 容器」（在外部 shared-db 網路）。
# 連線字串由 gitignore 的根目錄 .env 提供 MONGO_URI（見 .env.example）。
# 測試庫：mongodb://accounting_test_user:<pw>@mongodb:27017/accounting_db_test?authSource=accounting_db_test
# 穩定後切正式庫時只改 .env 的 MONGO_URI 即可。

services:
  # 後端服務（Flask / gunicorn）
  backend:
    build: ./backend
    container_name: accounting-backend
    ports:
      - "5001:8080"           # 對外除錯用；穩定後可移除，只留 proxy 對外
    environment:
      - MONGO_URI=${MONGO_URI:?請在根目錄 .env 設定 MONGO_URI（指向現有 mongodb 容器）}
      - PORT=8080
      - TESTING=false
      # JWT_SECRET / SMTP / 密碼政策等，由掛載的 backend/.env 提供（load_dotenv 讀取）
    volumes:
      - ./backend:/app
    networks:
      - accounting-network    # 與 frontend / proxy 互通
      - shared-db             # 連到現有 mongodb 容器所在網路
    command: python main.py

  # 前端服務（靜態文件服務器）
  frontend:
    image: nginx:alpine
    container_name: accounting-frontend
    ports:
      - "8080:80"             # 對外除錯用；穩定後可移除，只留 proxy 對外
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - accounting-network

  # 統一 HTTPS 入口（反向代理）：同源服務前端 + 後端，TLS 終結於此
  proxy:
    image: nginx:alpine
    container_name: accounting-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      # tailscale cert 產生的憑證（host 路徑）；若 ${HOME} 未展開，改成絕對路徑如 /home/ubuntu/nginx/certs
      - ${HOME}/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - accounting-network

networks:
  accounting-network:
    driver: bridge
  # 現有 MongoDB 容器所在的外部網路（需先存在：docker network ls 應看得到 shared-db）
  shared-db:
    external: true

# ── 統一 HTTPS 入口（Tailscale 網域）────────────────────────────────
# 前端 + 後端同源：同一網址、同一 port(443)，取代跨來源 CORS。
# TLS 憑證由 tailscale cert 產生，掛載於 /etc/nginx/certs。
# API 前綴有兩個：/api/（auth/user）與 /admin/api/（accounting/stats/budget…），皆代理到後端。
#
# 上游主機名（backend/frontend）以「變數 + resolver」動態解析：
#   字面 proxy_pass http://backend:8080 會在啟動當下解析 DNS，失敗就 [emerg] 拒啟不重試；
#   改用變數會延到「請求時」才透過 Docker 內建 DNS(127.0.0.11) 解析，
#   backend 重啟或 DNS 短暫延遲都不會讓 proxy 掛掉。

# HTTP → HTTPS 轉址
server {
    listen 80;
    server_name ubuntu-server.tail886591.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ubuntu-server.tail886591.ts.net;

    ssl_certificate     /etc/nginx/certs/ubuntu-server.tail886591.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/ubuntu-server.tail886591.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 對齊後端 MAX_CONTENT_LENGTH（16MB）
    client_max_body_size 16m;

    # Docker 內建 DNS；valid=10s 讓解析結果只快取 10 秒（容器換 IP 也能跟上）
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 共用 proxy 標頭（server 層設定，location 只寫 proxy_pass 即繼承）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 後端 API（兩個前綴都要）。用變數 → 請求時才解析；$request_uri 保留完整路徑與查詢字串
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:8080$request_uri;
    }
    location /admin/api/ {
        set $backend backend;
        proxy_pass http://$backend:8080$request_uri;
    }
    # 健康檢查（可選）
    location = /health {
        set $backend backend;
        proxy_pass http://$backend:8080$request_uri;
    }

    # 其餘一律 → 前端靜態服務
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:80$request_uri;
    }
}

# ── 統一 HTTPS 入口（Tailscale 網域）────────────────────────────────
# 前端 + 後端同源：同一網址、同一 port(443)，取代跨來源 CORS。
# TLS 憑證由 tailscale cert 產生，掛載於 /etc/nginx/certs。
# API 前綴有兩個：/api/（auth/user）與 /admin/api/（accounting/stats/budget…），皆代理到後端。

# HTTP → HTTPS 轉址
server {
    listen 80;
    server_name ubuntu-server.tail886591.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ubuntu-server.tail886591.ts.net;

    ssl_certificate     /etc/nginx/certs/ubuntu-server.tail886591.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/ubuntu-server.tail886591.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 對齊後端 MAX_CONTENT_LENGTH（16MB）
    client_max_body_size 16m;

    # 共用 proxy 標頭（server 層設定，location 只寫 proxy_pass 即繼承）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 後端 API（兩個前綴都要）
    location /api/ {
        proxy_pass http://backend:8080;
    }
    location /admin/api/ {
        proxy_pass http://backend:8080;
    }
    # 健康檢查（可選）
    location = /health {
        proxy_pass http://backend:8080;
    }

    # 其餘一律 → 前端靜態服務
    location / {
        proxy_pass http://frontend:80;
    }
}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概覽儀表板 · 釘選式互動原型</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --fill: #eef0f3; --border: #e3e6ea;
    --text: #1a1d21; --text2: #454b52; --muted: #6b7280; --muted2: #8a9099; --faint: #aeb4bd;
    --accent: #1f6feb; --accent-soft: #e7f0ff; --accent-soft-text: #1a5fd0;
    --income: #3f8f66; --expense: #b15c58;
    --card-bd: #c4cad3; --card-bw: 2px;
    --shadow: 0 1px 2px rgba(20,25,35,.04), 0 6px 18px rgba(20,25,35,.05);
    --c1:#7d6fe0; --c2:#e05fa0; --c3:#9b5fe0; --c4:#e0894f; --c5:#4f86e0;
    --font: "PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono: "IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --surface:#181b20; --fill:#22262d; --border:#2b3038;
      --text:#eef1f5; --text2:#c3c9d1; --muted:#9aa1ab; --muted2:#828a95; --faint:#5c636d;
      --accent:#4b8bf4; --accent-soft:#17233a; --accent-soft-text:#9cc0ff;
      --income:#5cb98a; --expense:#d98a85;
      --card-bd:var(--border); --card-bw:1.5px;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="light"] {
    --bg:#f5f6f8; --surface:#ffffff; --fill:#eef0f3; --border:#e3e6ea;
    --text:#1a1d21; --text2:#454b52; --muted:#6b7280; --muted2:#8a9099; --faint:#aeb4bd;
    --accent:#1f6feb; --accent-soft:#e7f0ff; --accent-soft-text:#1a5fd0;
    --income:#3f8f66; --expense:#b15c58;
    --card-bd:#c4cad3; --card-bw:2px;
    --shadow:0 1px 2px rgba(20,25,35,.04), 0 6px 18px rgba(20,25,35,.05);
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --surface:#181b20; --fill:#22262d; --border:#2b3038;
    --text:#eef1f5; --text2:#c3c9d1; --muted:#9aa1ab; --muted2:#828a95; --faint:#5c636d;
    --accent:#4b8bf4; --accent-soft:#17233a; --accent-soft-text:#9cc0ff;
    --income:#5cb98a; --expense:#d98a85;
    --card-bd:var(--border); --card-bw:1.5px;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* 整頁 = 視窗高度的 flex 直欄，永不滾動 */
  .wrap { height: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 30px 18px;
    display: flex; flex-direction: column; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-shrink: 0; margin-bottom: 13px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.4px; }
  .sub { color: var(--muted2); font-size: 12.5px; margin-top: 3px; }
  .sub b { color: var(--accent); font-weight: 500; }

  .btn { font-family: var(--font); font-size: 12.5px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); border-radius: 9px; padding: 7px 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar { display: flex; gap: 9px; }

  /* KPI 列（壓縮：僅標籤 + 數值） */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; flex-shrink: 0; margin-bottom: 13px; }
  .kpi { background: var(--surface); border: var(--card-bw) solid var(--card-bd); border-radius: 13px;
    padding: 11px 15px; box-shadow: var(--shadow); }
  .kpi .kl { font-size: 12px; color: var(--muted2); display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .kpi .kl svg { width: 14px; height: 14px; opacity: .85; }
  .kpi .kv { font-weight: 600; font-size: 19px; letter-spacing: -.3px; }

  /* ===== deck：吃滿剩餘視窗高度，內部空間重新分配 ===== */
  .deck {
    flex: 1; min-height: 0; display: grid; gap: 14px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-auto-flow: row;
  }
  .deck.pinned { grid-template-columns: 1fr 268px; grid-template-rows: 1fr 1fr 1fr; }

  .card {
    background: var(--surface); border: var(--card-bw) solid var(--card-bd); border-radius: 15px;
    padding: 16px 17px; overflow: hidden; cursor: pointer; position: relative;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    box-shadow: var(--shadow); will-change: transform;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.is-pinned { cursor: default; border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .card.is-thumb { padding: 11px 13px; }

  .chead { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; flex-shrink: 0; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .ctitle { font-weight: 600; font-size: 14.5px; color: var(--text); }
  .is-thumb .ctitle { font-size: 13px; }
  .pinbtn { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: var(--faint); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card:hover .pinbtn { color: var(--muted2); }
  .is-pinned .pinbtn { color: var(--accent); background: var(--accent-soft); }
  .pinbtn svg { width: 16px; height: 16px; }

  .cbody { flex: 1; min-height: 0; display: flex; flex-direction: column; filter: blur(0); transition: filter .3s ease, opacity .25s ease; }
  /* 框架縮放期間：內容維持可見但「模糊」，讓人感受到內容也在變化，而非空殼移動；
     框架到位後（移除 morphing）模糊才退去、內容同時切換成該階段的樣子 */
  .card.morphing .cbody { filter: blur(6px); transition: none; }
  /* 配角卡：框架動畫期間整張隱藏（不飛），避免空白卡彼此交錯重疊；到位後才淡入 */
  .card.ghost { opacity: 0; }

  .full-link { display: none; }
  .is-pinned .full-link { display: inline-flex; }
  .is-thumb .thumb-hide { display: none !important; }
  .is-thumb .cbody { justify-content: center; }

  /* 縮圖狀態：大幅精簡內容，確保塞進實際縮圖高度、不溢出 */
  .is-thumb .flink { display: none; }             /* 空的頁尾（查看完整頁只在釘選態）→ 收掉 */
  .is-thumb .chead { margin-bottom: 8px; }
  .is-thumb .donut-wrap { gap: 0; }
  .is-thumb .donut svg { width: 92px; height: 92px; }
  .is-thumb .center .amt { font-size: 15px; }
  .is-thumb .center .lab { font-size: 9px; }
  .is-thumb .tx { padding: 4px 0; border-bottom: none; }
  .is-thumb .tx .ic { width: 26px; height: 26px; }
  .is-thumb .bud-total { margin-bottom: 6px; }
  .is-thumb .bud-total .big { font-size: 16px; }

  .flink { margin-top: auto; padding-top: 12px; }
  .full-link { align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-family: var(--font); font-weight: 500; }
  .full-link:hover { filter: brightness(.97); }
  .full-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; flex: 1; min-height: 0; }
  .donut { position: relative; flex-shrink: 0; }
  .donut svg { display: block; }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .center .lab { font-size: 11px; color: var(--muted2); }
  .center .amt { font-weight: 600; font-size: 20px; color: var(--text); }
  .is-pinned .center .amt { font-size: 26px; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .legend .row span.n { flex: 1; color: var(--text2); }
  .legend .row span.v { color: var(--muted2); }

  .spark { flex: 1; min-height: 0; display: flex; align-items: stretch; }
  .spark svg { width: 100%; height: 100%; }

  .tx { display: flex; align-items: center; gap: 11px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .tx:last-of-type { border-bottom: none; }
  .tx .ic { width: 29px; height: 29px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .tx .ic svg { width: 15px; height: 15px; }
  .tx .nm { flex: 1; min-width: 0; }
  .tx .nm b { font-weight: 500; font-size: 13.5px; color: var(--text); display: block; }
  .tx .nm small { font-size: 11.5px; color: var(--muted2); }
  .tx .amt { font-size: 13.5px; font-weight: 500; }

  .bud-total { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
  .bud-total .big { font-size: 20px; font-weight: 600; }
  .is-pinned .bud-total .big { font-size: 24px; }
  .track { height: 8px; border-radius: 5px; background: var(--fill); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
  .brow { margin-top: 12px; }
  .brow .lab { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .brow .lab .n { color: var(--text2); }
  .brow .lab .v { color: var(--muted2); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--surface); font-size: 13.5px; padding: 11px 18px; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 50; display: flex; align-items: center; gap: 8px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>概覽</h1>
      <div class="sub">2026-07 · 財務總覽　<b>點卡片釘選放大</b> · 再點取消 · 假資料原型 · 整頁鎖定視窗高度不滾動</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="anim" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>動畫 開</button>
      <button class="btn" id="speed" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>慢動作 1×</button>
      <button class="btn" id="reset" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重置</button>
      <button class="btn" id="theme" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>主題</button>
    </div>
  </div>

  <!-- KPI 列 -->
  <div class="kpis">
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h.01"/></svg>淨資產</div><div class="kv mono" style="color:var(--income)">NT$ 40,823</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></svg>現金結餘</div><div class="kv mono" style="color:var(--income)">NT$ 40,823</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7v10H7"/></svg>本月收入</div><div class="kv mono" style="color:var(--income)">NT$ 43,500</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L7 7M7 17V7h10"/></svg>本月支出</div><div class="kv mono" style="color:var(--expense)">NT$ 2,677</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4M4 7h12M16 21l4-4-4-4M20 17H8"/></svg>應收 / 應付</div><div class="kv mono"><span style="color:var(--income)">0</span> <span style="color:var(--faint)">/</span> <span style="color:var(--expense)">0</span></div></div>
  </div>

  <div class="deck" id="deck">
    <article class="card" data-id="donut" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--c1)"></span><span class="ctitle">分類佔比</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div class="donut-wrap">
          <div class="donut" id="donutSvg"></div>
          <div class="legend thumb-hide">
            <div class="row"><span class="dot" style="background:var(--c1)"></span><span class="n">居住</span><span class="v mono">45%</span></div>
            <div class="row"><span class="dot" style="background:var(--c2)"></span><span class="n">服飾</span><span class="v mono">25%</span></div>
            <div class="row"><span class="dot" style="background:var(--c4)"></span><span class="n">餐飲</span><span class="v mono">14%</span></div>
            <div class="row"><span class="dot" style="background:var(--c3)"></span><span class="n">娛樂</span><span class="v mono">12%</span></div>
            <div class="row"><span class="dot" style="background:var(--c5)"></span><span class="n">交通</span><span class="v mono">4%</span></div>
          </div>
        </div>
        <div class="flink"><button class="full-link" type="button" data-nav="統計">查看完整「統計」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>

    <article class="card" data-id="trend" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--expense)"></span><span class="ctitle">支出趨勢</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div class="spark" id="sparkSvg"></div>
        <div class="flink"><button class="full-link" type="button" data-nav="統計">查看完整「統計」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>

    <article class="card" data-id="recent" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--accent)"></span><span class="ctitle">最近交易</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div id="txList"></div>
        <div class="flink"><button class="full-link" type="button" data-nav="明細">查看完整「明細」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>

    <article class="card" data-id="budget" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--income)"></span><span class="ctitle">預算概覽</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div class="bud-total"><span class="big mono">2,677 <span style="font-size:13px;color:var(--faint)">/ 26,500</span></span><span style="font-size:12.5px;color:var(--muted2)">剩 23,823</span></div>
        <div class="track"><i style="width:10%"></i></div>
        <div id="budRows" class="thumb-hide"></div>
        <div class="flink"><button class="full-link" type="button" data-nav="預算">查看完整「預算」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const root = document.documentElement;
  document.getElementById('theme').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  (function donut() {
    const segs = [['var(--c1)',45],['var(--c2)',25],['var(--c4)',14],['var(--c3)',12],['var(--c5)',4]];
    const r = 52, c = 2 * Math.PI * r, size = 128;
    let off = 0, parts = '';
    for (const [col, pct] of segs) {
      const len = c * pct / 100;
      parts += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len - 3} ${c - len + 3}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/>`;
      off += len;
    }
    document.getElementById('donutSvg').innerHTML =
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${parts}</svg>
       <div class="center"><div class="lab">本月支出</div><div class="amt mono">2,677</div></div>`;
  })();

  (function spark() {
    const pts = [1200, 900, 1500, 800, 300, 2677];
    const W = 320, H = 140, pad = 8, plotH = H - 30, max = Math.max(...pts);
    const xs = pts.map((_, i) => pad + i * (W - pad * 2) / (pts.length - 1));
    const ys = pts.map(v => 12 + plotH - v / max * plotH);
    let d = ''; xs.forEach((x, i) => d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${ys[i].toFixed(1)} `);
    const area = `${d} L${xs[xs.length-1]} ${12+plotH} L${xs[0]} ${12+plotH} Z`;
    const labels = ['02','03','04','05','06','07'];
    const lab = xs.map((x,i)=>`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted2)" font-family="var(--mono)">${labels[i]}</text>`).join('');
    document.getElementById('sparkSvg').innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${area}" fill="var(--expense)" opacity="0.10"/>
        <path d="${d}" fill="none" stroke="var(--expense)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="4" fill="var(--expense)" stroke="var(--surface)" stroke-width="2"/>
        ${lab}
      </svg>`;
  })();

  (function tx() {
    const rows = [
      ['薪資','2026-07-05 · 月薪','+42,000','var(--income)','var(--income)'],
      ['投資收益','2026-07-04 · 股息','+1,500','var(--income)','var(--income)'],
      ['服飾','2026-07-02 · T恤','−680','var(--text)','var(--c2)'],
      ['電影/展覽','2026-07-03','−320','var(--text)','var(--c3)'],
      ['午餐','2026-07-01 · 便當','−250','var(--text)','var(--c4)'],
    ];
    // 縮圖態只保留前 2 筆（index >= 2 加 thumb-hide），避免超出縮圖高度
    document.getElementById('txList').innerHTML = rows.map(([n,s,a,ac,ic], i) =>
      `<div class="tx${i >= 2 ? ' thumb-hide' : ''}"><div class="ic" style="background:color-mix(in srgb, ${ic} 16%, transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="${ic}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M4 10h16"/></svg></div>
       <div class="nm"><b>${n}</b><small>${s}</small></div><div class="amt mono" style="color:${ac}">${a}</div></div>`).join('');
  })();

  (function bud() {
    const rows = [['早餐',137,3000,'var(--c4)'],['午餐',250,4000,'var(--c4)'],['居住',0,15000,'var(--c1)'],['娛樂',0,2500,'var(--c3)']];
    document.getElementById('budRows').innerHTML = rows.map(([n,s,b,col]) =>
      `<div class="brow"><div class="lab"><span class="n">${n}</span><span class="v mono">${s.toLocaleString()} / ${b.toLocaleString()}</span></div>
       <div class="track"><i style="width:${Math.min(100,s/b*100)}%;background:${col}"></i></div></div>`).join('');
  })();

  const deck = document.getElementById('deck');
  const cards = [...deck.querySelectorAll('.card')];
  let pinned = null;
  let flipDur = 0.4; // 正常節奏（秒）；慢動作鈕以此為基準倍率放慢（診斷用）

  // 只調整「框架」：deck 版型 + 各卡 grid 定位（不動內容細節）
  function applyFrameLayout(pin) {
    if (!pin) {
      deck.classList.remove('pinned');
      cards.forEach(c => { c.style.gridColumn = ''; c.style.gridRow = ''; });
    } else {
      deck.classList.add('pinned');
      let r = 1;
      cards.forEach(c => {
        if (c === pin) { c.style.gridColumn = '1'; c.style.gridRow = '1 / span 3'; }
        else { c.style.gridColumn = '2'; c.style.gridRow = String(r++); }
      });
    }
  }
  // 只切換「內容細節」：釘選/縮圖的精簡程度、padding、邊框強調、aria
  function applyContentState(pin) {
    cards.forEach(c => {
      const isPin = c === pin, isThumb = pin && c !== pin;
      c.classList.toggle('is-pinned', isPin);
      c.classList.toggle('is-thumb', isThumb);
      c.setAttribute('aria-pressed', isPin ? 'true' : 'false');
    });
  }

  // 反向補償：主角框架 scale 期間，每一格讀取當下縮放比例，對「標題列各元素」
  // （分類圓點、標題文字、釘選 icon）各自套 1/scale（繞各自中心）。
  // 關鍵是補償「個別元素」而非整個 .chead —— 這樣：
  //   (1) 字級/圓點/icon 尺寸維持固定、不被拉伸；
  //   (2) 各元素「位置」仍由卡片 transform 決定 → 跟著 FLIP 平滑插值移動，
  //       右上角 icon 會沿著卡片右緣同步過渡，不再瞬間跳到最終座標。
  function startHeadCounterScale(hero) {
    const els = [...hero.querySelectorAll('.chead > .dot, .chead > .ctitle, .chead > .pinbtn')];
    if (!els.length) return () => {};
    els.forEach(el => { el.style.transformOrigin = 'center'; });
    let running = true;
    const tick = () => {
      if (!running) return;
      const tf = getComputedStyle(hero).transform;
      let sx = 1, sy = 1;
      if (tf && tf !== 'none') { const m = new DOMMatrixReadOnly(tf); sx = m.a || 1; sy = m.d || 1; }
      const t = `scale(${1 / sx}, ${1 / sy})`;
      els.forEach(el => { el.style.transform = t; });
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return () => { running = false; els.forEach(el => { el.style.transform = ''; el.style.transformOrigin = ''; }); };
  }

  // 原型：預設一律播動畫，讓 artifact 環境（沙箱 iframe 可能回報 reduced-motion）也看得到動畫。
  // 可用工具列「動畫 開/關」直接對比跳變 vs 動畫。正式版應改回依 prefers-reduced-motion 決定。
  let animEnabled = true;
  let animating = false;

  function togglePin(card) {
    if (animating) return;
    pinned = (pinned === card) ? null : card;
    const hero = card; // 只有「被點的卡」做空間動畫（飛/縮放）；其餘卡不飛，避免路徑交錯重疊

    if (!animEnabled) {   // 跳變：直接切換版型與內容，無動畫
      applyFrameLayout(pinned); applyContentState(pinned);
      cards.forEach(c => { c.style.transform = ''; c.style.opacity = ''; c.classList.remove('ghost', 'morphing'); });
      return;
    }

    // 量測 → 套框架版型 → 隱藏內容
    const first = cards.map(c => c.getBoundingClientRect());
    applyFrameLayout(pinned);
    cards.forEach(c => c.classList.add('morphing'));
    const last = cards.map(c => c.getBoundingClientRect());

    cards.forEach((c, i) => {
      if (c === hero) {
        // 主角：FLIP 從舊位置/尺寸平滑縮放到新定點
        const dx = first[i].left - last[i].left, dy = first[i].top - last[i].top;
        const sx = first[i].width / last[i].width || 1, sy = first[i].height / last[i].height || 1;
        c.style.transition = 'none';
        c.style.transformOrigin = 'top left';
        c.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
      } else {
        // 配角：不飛，直接在新位置隱藏（整張 ghost），等主角到位後再淡入
        c.style.transition = 'none';
        c.style.transform = '';
        c.classList.add('ghost');
      }
    });

    animating = true;
    let stopCounter = () => {};
    requestAnimationFrame(() => {
      hero.style.transition = 'transform ' + flipDur + 's cubic-bezier(.37,0,.63,1)';
      hero.style.transform = '';
      stopCounter = startHeadCounterScale(hero); // 標題列各元素反向補償，抵消拉伸並讓 icon 跟著卡片平滑移動
    });

    // Phase 2：主角框架到位後，才切換內容並淡入（主角內容 + 配角整張）
    setTimeout(() => {
      stopCounter();                          // 停止補償、清掉標題暫時的 transform
      applyContentState(pinned);
      cards.forEach(c => {
        c.classList.remove('morphing');       // 主角 .cbody 淡入
        if (c !== hero) {
          c.style.transition = 'opacity .28s ease';
          c.classList.remove('ghost');         // 配角整張淡入
        }
      });
      animating = false;
    }, flipDur * 1000 + 40);
  }

  cards.forEach(card => {
    card.addEventListener('click', (e) => {
      const link = e.target.closest('.full-link');
      if (link) { e.stopPropagation(); showToast(link.dataset.nav); return; }
      togglePin(card);
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePin(card); }
    });
  });
  document.getElementById('reset').addEventListener('click', () => { if (pinned) togglePin(pinned); });

  // 動畫 開/關：可直接對比「跳變」與「動畫」兩種體驗
  const animBtn = document.getElementById('anim');
  animBtn.addEventListener('click', () => {
    if (animating) return;
    animEnabled = !animEnabled;
    animBtn.lastChild.textContent = animEnabled ? '動畫 開' : '動畫 關';
  });

  // 慢動作：以正常節奏 0.4s 為基準，循環 1× / 2× / 4× 放慢（診斷用，可看清縮放過程）
  const speedBtn = document.getElementById('speed');
  const MULTS = [1, 2, 4];
  let speedMult = 1;
  speedBtn.addEventListener('click', () => {
    speedMult = MULTS[(MULTS.indexOf(speedMult) + 1) % MULTS.length];
    flipDur = 0.4 * speedMult;
    speedBtn.lastChild.textContent = `慢動作 ${speedMult}×`;
  });

  const toastEl = document.getElementById('toast');
  let toastT;
  function showToast(nav) {
    toastEl.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg> 正式版會導向「${nav}」頁`;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
</script>
</body>
</html>

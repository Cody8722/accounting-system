<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概覽儀表板 · 釘選式互動原型 v2（打磨版）</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --fill: #eef0f3; --border: #e3e6ea;
    --text: #1a1d21; --text2: #454b52; --muted: #6b7280; --muted2: #8a9099; --faint: #aeb4bd;
    --accent: #1f6feb; --accent-soft: #e7f0ff; --accent-soft-text: #1a5fd0;
    --income: #3f8f66; --expense: #b15c58;
    --card-bd: #c4cad3; --card-bw: 2px;
    --shadow: 0 1px 2px rgba(20,25,35,.04), 0 6px 18px rgba(20,25,35,.05);
    --c1:#7d6fe0; --c2:#e05fa0; --c3:#9b5fe0; --c4:#e0894f; --c5:#4f86e0;
    --font: "PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono: "IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --surface:#181b20; --fill:#22262d; --border:#2b3038;
      --text:#eef1f5; --text2:#c3c9d1; --muted:#9aa1ab; --muted2:#828a95; --faint:#5c636d;
      --accent:#4b8bf4; --accent-soft:#17233a; --accent-soft-text:#9cc0ff;
      --income:#5cb98a; --expense:#d98a85;
      --card-bd:var(--border); --card-bw:1.5px;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="light"] {
    --bg:#f5f6f8; --surface:#ffffff; --fill:#eef0f3; --border:#e3e6ea;
    --text:#1a1d21; --text2:#454b52; --muted:#6b7280; --muted2:#8a9099; --faint:#aeb4bd;
    --accent:#1f6feb; --accent-soft:#e7f0ff; --accent-soft-text:#1a5fd0;
    --income:#3f8f66; --expense:#b15c58;
    --card-bd:#c4cad3; --card-bw:2px;
    --shadow:0 1px 2px rgba(20,25,35,.04), 0 6px 18px rgba(20,25,35,.05);
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --surface:#181b20; --fill:#22262d; --border:#2b3038;
    --text:#eef1f5; --text2:#c3c9d1; --muted:#9aa1ab; --muted2:#828a95; --faint:#5c636d;
    --accent:#4b8bf4; --accent-soft:#17233a; --accent-soft-text:#9cc0ff;
    --income:#5cb98a; --expense:#d98a85;
    --card-bd:var(--border); --card-bw:1.5px;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap { height: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 30px 18px;
    display: flex; flex-direction: column; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-shrink: 0; margin-bottom: 13px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.4px; }
  .sub { color: var(--muted2); font-size: 12.5px; margin-top: 3px; max-height: 40px; opacity: 1; overflow: hidden; }
  .sub b { color: var(--accent); font-weight: 500; }
  /* 釘選時：整個頂部 chrome（標題＋KPI 列）一起讓位——不是把 deck 硬塞進剩餘空間，
     而是主動把「非核心」資訊收合變小，把騰出來的高度讓給主角卡片，讓中間真的變大。
     用真實版面屬性（font-size/padding/max-height）transition，不用 transform scale，
     文字全程不失真、不跳動，跟卡片本身的打磨邏輯一致。 */
  .wrap.compact .top { margin-bottom: 6px; }
  .wrap.compact h1 { font-size: 16px; }
  .wrap.compact .sub { opacity: 0; max-height: 0; margin-top: 0; }
  /* 釘選/取消釘選的這一瞬間，chrome 跟配角縮圖一樣處理：不飛、不伸縮各個屬性，
     單純在新位置瞬間藏起來（透明+模糊），動畫結束後才回淡入。 */
  /* 不完全消失，只是模糊+稍微變暗——原本的「不完全隱藏」原則也適用在 chrome 上，
     避免整頁瞬間空掉、只剩主角卡片孤零零在動的違和感。 */
  .chrome-ghost { opacity: .45; filter: blur(9px); }

  .btn { font-family: var(--font); font-size: 12.5px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); border-radius: 9px; padding: 7px 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar { display: flex; gap: 9px; }

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; flex-shrink: 0; margin-bottom: 13px; }
  .kpi { background: var(--surface); border: var(--card-bw) solid var(--card-bd); border-radius: 13px;
    padding: 11px 15px; box-shadow: var(--shadow); }
  .kpi .kl { font-size: 12px; color: var(--muted2); display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .kpi .kl svg { width: 14px; height: 14px; opacity: .85; }
  .kpi .kv { font-weight: 600; font-size: 19px; letter-spacing: -.3px; }
  .wrap.compact .kpis { gap: 8px; margin-bottom: 8px; }
  .wrap.compact .kpi { padding: 6px 12px; }
  .wrap.compact .kpi .kl { margin-bottom: 1px; font-size: 10px; }
  .wrap.compact .kpi .kv { font-size: 14px; }

  .deck {
    flex: 1; min-height: 0; display: grid; gap: 14px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-auto-flow: row;
  }
  .deck.pinned { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 0.4fr; }

  .card {
    background: var(--surface); border: var(--card-bw) solid var(--card-bd); border-radius: 15px;
    padding: 16px 17px; overflow: hidden; cursor: pointer; position: relative;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    box-shadow: var(--shadow); will-change: transform;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.is-pinned { cursor: default; border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .card.is-thumb { padding: 11px 13px; }
  .card.morphing { pointer-events: none; }

  .chead { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; flex-shrink: 0; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .ctitle { font-weight: 600; font-size: 14.5px; color: var(--text); }
  .is-thumb .ctitle { font-size: 13px; }
  .pinbtn { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: var(--faint); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card:hover .pinbtn { color: var(--muted2); }
  .is-pinned .pinbtn { color: var(--accent); background: var(--accent-soft); }
  .pinbtn svg { width: 16px; height: 16px; }

  /* cbody 的 blur 完全由 JS 逐幀驅動（動態物件），CSS 只負責靜態初始值；
     ghost 卡的模糊→清晰改由淡入當下臨時指定 transition（見 JS），避免跟主角的
     rAF 手動驅動互相搶奪同一個 filter 屬性造成不同步。 */
  .cbody { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .card.ghost { opacity: .4; }
  .card.ghost .cbody { filter: blur(9px); }

  .full-link { display: none; }
  .is-pinned .full-link { display: inline-flex; }
  .is-thumb .thumb-hide { display: none !important; }
  .is-thumb .cbody { justify-content: center; }

  .is-thumb .flink { display: none; }
  .is-thumb .chead { margin-bottom: 8px; }
  .is-thumb .donut-wrap { gap: 0; }
  .is-thumb .donut svg { width: 92px; height: 92px; }
  .is-thumb .center .amt { font-size: 15px; }
  .is-thumb .center .lab { font-size: 9px; }
  .is-thumb .tx { padding: 4px 0; border-bottom: none; }
  .is-thumb .tx .ic { width: 26px; height: 26px; }
  .is-thumb .bud-total { margin-bottom: 6px; }
  .is-thumb .bud-total .big { font-size: 16px; }

  .flink { margin-top: auto; padding-top: 12px; }
  .full-link { align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-family: var(--font); font-weight: 500; }
  .full-link:hover { filter: brightness(.97); }
  .full-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; flex: 1; min-height: 0; }
  .donut { position: relative; flex-shrink: 0; }
  .donut svg { display: block; }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .center .lab { font-size: 11px; color: var(--muted2); }
  .center .amt { font-weight: 600; font-size: 20px; color: var(--text); }
  .is-pinned .center .amt { font-size: 26px; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .legend .row span.n { flex: 1; color: var(--text2); }
  .legend .row span.v { color: var(--muted2); }

  .spark { flex: 1; min-height: 0; display: flex; align-items: stretch; }
  .spark svg { width: 100%; height: 100%; }

  .tx { display: flex; align-items: center; gap: 11px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .tx:last-of-type { border-bottom: none; }
  .tx .ic { width: 29px; height: 29px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .tx .ic svg { width: 15px; height: 15px; }
  .tx .nm { flex: 1; min-width: 0; }
  .tx .nm b { font-weight: 500; font-size: 13.5px; color: var(--text); display: block; }
  .tx .nm small { font-size: 11.5px; color: var(--muted2); }
  .tx .amt { font-size: 13.5px; font-weight: 500; }

  .bud-total { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
  .bud-total .big { font-size: 20px; font-weight: 600; }
  .is-pinned .bud-total .big { font-size: 24px; }
  .track { height: 8px; border-radius: 5px; background: var(--fill); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
  .brow { margin-top: 12px; }
  .brow .lab { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .brow .lab .n { color: var(--text2); }
  .brow .lab .v { color: var(--muted2); }

  /* 骨架佔位圖：模糊最深那一刻，真實內容淡出、簡化色塊淡入到峰值，再一起淡回真實內容。
     每張卡自己的骨架形狀對應自己的內容（圓環/波浪/列表/進度條），不是四張卡套同一套樣板。 */
  .skel-overlay { position: absolute; inset: 0; opacity: 0; pointer-events: none; display: flex; }
  .skel-bar { border-radius: 4px; background: var(--fill); flex-shrink: 0; }
  .skel-circle { border-radius: 50%; background: var(--fill); flex-shrink: 0; }
  .skel-donut { align-items: center; justify-content: center; gap: 22px; }
  .skel-donut .skel-legend { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .skel-trend { align-items: flex-end; gap: 8px; padding: 4px 2px 0; }
  .skel-trend .skel-bar { flex: 1; }
  .skel-recent { flex-direction: column; gap: 12px; padding-top: 2px; }
  .skel-recent .skel-row { display: flex; align-items: center; gap: 11px; }
  .skel-recent .skel-row .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .skel-budget { flex-direction: column; gap: 10px; padding-top: 2px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--surface); font-size: 13.5px; padding: 11px 18px; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 50; display: flex; align-items: center; gap: 8px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .diag { position: fixed; right: 18px; bottom: 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 11.5px; color: var(--muted2); box-shadow: var(--shadow);
    font-family: var(--mono); z-index: 40; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>概覽</h1>
      <div class="sub">2026-07 · 財務總覽　<b>點卡片釘選放大</b> · 再點取消 · 假資料原型 · 整頁鎖定視窗高度不滾動</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="anim" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>動畫 開</button>
      <button class="btn" id="speed" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>慢動作 1×</button>
      <button class="btn" id="reset" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重置</button>
      <button class="btn" id="theme" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>主題</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h.01"/></svg>淨資產</div><div class="kv mono" style="color:var(--income)">NT$ 40,823</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></svg>現金結餘</div><div class="kv mono" style="color:var(--income)">NT$ 40,823</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7v10H7"/></svg>本月收入</div><div class="kv mono" style="color:var(--income)">NT$ 43,500</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L7 7M7 17V7h10"/></svg>本月支出</div><div class="kv mono" style="color:var(--expense)">NT$ 2,677</div></div>
    <div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4M4 7h12M16 21l4-4-4-4M20 17H8"/></svg>應收 / 應付</div><div class="kv mono"><span style="color:var(--income)">0</span> <span style="color:var(--faint)">/</span> <span style="color:var(--expense)">0</span></div></div>
  </div>

  <div class="deck" id="deck">
    <article class="card" data-id="donut" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--c1)"></span><span class="ctitle">分類佔比</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div class="donut-wrap skel-target">
          <div class="donut" id="donutSvg"></div>
          <div class="legend thumb-hide">
            <div class="row"><span class="dot" style="background:var(--c1)"></span><span class="n">居住</span><span class="v mono">45%</span></div>
            <div class="row"><span class="dot" style="background:var(--c2)"></span><span class="n">服飾</span><span class="v mono">25%</span></div>
            <div class="row"><span class="dot" style="background:var(--c4)"></span><span class="n">餐飲</span><span class="v mono">14%</span></div>
            <div class="row"><span class="dot" style="background:var(--c3)"></span><span class="n">娛樂</span><span class="v mono">12%</span></div>
            <div class="row"><span class="dot" style="background:var(--c5)"></span><span class="n">交通</span><span class="v mono">4%</span></div>
          </div>
        </div>
        <div class="skel-overlay skel-donut">
          <div class="skel-circle" style="width:96px;height:96px"></div>
          <div class="skel-legend">
            <div class="skel-bar" style="width:76px;height:9px"></div>
            <div class="skel-bar" style="width:60px;height:9px"></div>
            <div class="skel-bar" style="width:68px;height:9px"></div>
          </div>
        </div>
        <div class="flink"><button class="full-link" type="button" data-nav="統計">查看完整「統計」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>

    <article class="card" data-id="trend" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--expense)"></span><span class="ctitle">支出趨勢</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div class="spark skel-target" id="sparkSvg"></div>
        <div class="skel-overlay skel-trend">
          <div class="skel-bar" style="height:38%"></div>
          <div class="skel-bar" style="height:26%"></div>
          <div class="skel-bar" style="height:55%"></div>
          <div class="skel-bar" style="height:22%"></div>
          <div class="skel-bar" style="height:12%"></div>
          <div class="skel-bar" style="height:80%"></div>
        </div>
        <div class="flink"><button class="full-link" type="button" data-nav="統計">查看完整「統計」頁 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button></div>
      </div>
    </article>

    <article class="card" data-id="recent" tabindex="0" role="button" aria-pressed="false">
      <div class="chead"><span class="dot" style="background:var(--accent)"></span><span class="ctitle">最近交易</span>
        <button class="pinbtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7z"/></svg></button>
      </div>
      <div class="cbody">
        <div id="txList" class="skel-target"></div>
        <div class="skel-overlay skel-recent">
          <div class="skel-row"><div class="skel-circle" style="width:29px;height:29px"></div><div class="skel-lines"><div class="skel-bar" style="width:58%;height:9px"></div><div class="skel-bar" style="width:36%;height:8px"></div></div></div>
          <div class="skel-row"><div class="skel-circle" style="width:29px;height:29px"></div><div class="skel-lines"><div class="skel-bar" style="width:44%;height:9px"></div><div class="skel-bar" style="width:30%;height:8px"></div></div></div>

<div class="toast" id="toast"></div>

<script>
  const root = document.documentElement;
  document.getElementById('theme').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  (function donut() {
    const segs = [['var(--c1)',45],['var(--c2)',25],['var(--c4)',14],['var(--c3)',12],['var(--c5)',4]];
    const r = 52, c = 2 * Math.PI * r, size = 128;
    let off = 0, parts = '';
    for (const [col, pct] of segs) {
      const len = c * pct / 100;
      parts += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len - 3} ${c - len + 3}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/>`;
      off += len;
    }
    document.getElementById('donutSvg').innerHTML =
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${parts}</svg>
       <div class="center"><div class="lab">本月支出</div><div class="amt mono">2,677</div></div>`;
  })();

  (function spark() {
    const pts = [1200, 900, 1500, 800, 300, 2677];
    const W = 320, H = 140, pad = 8, plotH = H - 30, max = Math.max(...pts);
    const xs = pts.map((_, i) => pad + i * (W - pad * 2) / (pts.length - 1));
    const ys = pts.map(v => 12 + plotH - v / max * plotH);
    let d = ''; xs.forEach((x, i) => d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${ys[i].toFixed(1)} `);
    const area = `${d} L${xs[xs.length-1]} ${12+plotH} L${xs[0]} ${12+plotH} Z`;
    const labels = ['02','03','04','05','06','07'];
    const lab = xs.map((x,i)=>`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted2)" font-family="var(--mono)">${labels[i]}</text>`).join('');
    document.getElementById('sparkSvg').innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${area}" fill="var(--expense)" opacity="0.10"/>
        <path d="${d}" fill="none" stroke="var(--expense)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="4" fill="var(--expense)" stroke="var(--surface)" stroke-width="2"/>
        ${lab}
      </svg>`;
  })();

  (function tx() {
    const rows = [
      ['薪資','2026-07-05 · 月薪','+42,000','var(--income)','var(--income)'],
      ['投資收益','2026-07-04 · 股息','+1,500','var(--income)','var(--income)'],
      ['服飾','2026-07-02 · T恤','−680','var(--text)','var(--c2)'],
      ['電影/展覽','2026-07-03','−320','var(--text)','var(--c3)'],
      ['午餐','2026-07-01 · 便當','−250','var(--text)','var(--c4)'],
    ];
    document.getElementById('txList').innerHTML = rows.map(([n,s,a,ac,ic], i) =>
      `<div class="tx${i >= 2 ? ' thumb-hide' : ''}"><div class="ic" style="background:color-mix(in srgb, ${ic} 16%, transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="${ic}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M4 10h16"/></svg></div>
       <div class="nm"><b>${n}</b><small>${s}</small></div><div class="amt mono" style="color:${ac}">${a}</div></div>`).join('');
  })();

  (function bud() {
    const rows = [['早餐',137,3000,'var(--c4)'],['午餐',250,4000,'var(--c4)'],['居住',0,15000,'var(--c1)'],['娛樂',0,2500,'var(--c3)']];
    document.getElementById('budRows').innerHTML = rows.map(([n,s,b,col]) =>
      `<div class="brow"><div class="lab"><span class="n">${n}</span><span class="v mono">${s.toLocaleString()} / ${b.toLocaleString()}</span></div>
       <div class="track"><i style="width:${Math.min(100,s/b*100)}%;background:${col}"></i></div></div>`).join('');
  })();

  const deck = document.getElementById('deck');
  const cards = [...deck.querySelectorAll('.card')];
  let pinned = null;
  let flipDur = 0.4; // 正常節奏（秒）；慢動作鈕以此為基準倍率放慢（診斷用）

  // ── 打磨重點：整個「主角/前主角」FLIP + 標題反向補償 + 模糊，
  // 全部由同一個 rAF 迴圈、同一個 progress 值驅動 ──
  // 舊版：CSS transition 驅動主角位移（瀏覽器合成執行緒），另外用 rAF 讀 getComputedStyle
  // 反向補償標題（主執行緒逐幀取樣）。兩者是「各自獨立的時間軸」，即使都是 0.4s，
  // 每一幀的取樣時機仍可能有 1 影格級的落差 → 標題感覺有微幅殘留誤差。
  // 新版：兩者共用同一個 eased progress（同一次數學運算），不再有兩條時間軸，
  // 從根本上消除文字的殘留晃動。
  const MORPH_BLUR = 10; // px，模糊峰值（原 6px 偏弱、看不出失焦感；10px 在放大過程仍可辨讀輪廓但明顯失焦）
  const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

  // ── 標題列改用「脫離縮放、獨立疊層」而非「反向補償」──
  // 舊法：標題留在會 scale() 的卡片裡，每幀算 1/scale 抵銷。問題在於文字一旦被非 1
  // 的 scale 影響過（即使瞬間又被抵銷回 1），瀏覽器仍會用當下的合成矩陣重新為文字
  // 抓字（re-rasterize glyph），兩個 transform 疊在一起在次像素上對不齊，看起來就是
  // 「還在跳」。新法：把標題整塊 clone 一份，放到不受卡片 transform 影響的固定疊層，
  // 全程只用 left/top/width/height 這些「真的版面屬性」在移動——瀏覽器排版引擎本來
  // 就穩定計算這些數字，圓點、文字、圖示自然用它們原本的字級/尺寸「黏著格線」平移，
  // 不需要任何 scale／反向 scale，字體渲染全程不受影響。
  const headOverlay = document.createElement('div');
  headOverlay.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:9999;';
  document.body.appendChild(headOverlay);

  const wrapEl = document.querySelector('.wrap');
  const topEl = document.querySelector('.top');
  const kpisEl = document.querySelector('.kpis');
  const h1El = document.querySelector('h1');
  const subEl = document.querySelector('.sub');
  const kpiEls = [...document.querySelectorAll('.kpi')];
  const lerp = (a, b, t) => a + (b - a) * t;

  function applyFrameLayout(pin) {
    // 釘選時同步收合上方 chrome（標題副標＋KPI 列），把讓出來的高度還給 deck，
    // 讓主角卡片「真的變大」而不是被固定版頭擠壓成扁扁一條。這一步要跟 grid 版型
    // 改動同時發生（都在量測 FLIP「last」座標之前），這樣主角動畫本身就會把
    // 「往上長高」這件事一併算進去，不會動畫結束後 chrome 才又收一次造成二次跳動。
    wrapEl.classList.toggle('compact', !!pin);
    if (!pin) {
      deck.classList.remove('pinned');
      cards.forEach(c => { c.style.gridColumn = ''; c.style.gridRow = ''; c.style.maxWidth = ''; c.style.width = ''; c.style.margin = ''; c.style.justifySelf = ''; });
    } else {
      deck.classList.add('pinned');
      let col = 1;
      cards.forEach(c => {
        if (c === pin) {
          c.style.gridColumn = '1 / -1'; c.style.gridRow = '1';
          // 主角寬度上限＋置中，避免橫向被硬拉滿版（1920 這種寬螢幕上會變成過扁的長條）；
          // 這裡用 inline style（不是 is-pinned class）是因為 FLIP 量測「last」座標時
          // is-pinned 還沒套用，若改用 class 量到的會是滿版寬度，動畫結束瞬間再收窄置中，
          // 造成到位後又跳一下的違和感。frame 版型與這個寬度上限必須同時生效。
          c.style.maxWidth = 'min(1040px, 100%)'; c.style.width = '100%'; c.style.margin = '0'; c.style.justifySelf = 'center';
        } else {
          c.style.gridColumn = String(col++); c.style.gridRow = '2';
          c.style.maxWidth = ''; c.style.width = ''; c.style.margin = ''; c.style.justifySelf = '';
        }
      });
    }
  }
  function applyContentState(pin) {
    cards.forEach(c => {
      const isPin = c === pin, isThumb = pin && c !== pin;
      c.classList.toggle('is-pinned', isPin);
      c.classList.toggle('is-thumb', isThumb);
      c.setAttribute('aria-pressed', isPin ? 'true' : 'false');
    });
  }

  let animEnabled = true;
  let animating = false;

  function togglePin(card) {
    if (animating) return;
    // 自癒性清理：若上一次動畫因某種未預期情況中斷（例如頁面被切到後台節流、或 rAF 被外部接手中斷），
    // 可能殘留未移除的標題疊層 clone、真實標題仍被 visibility:hidden。
    // 這裡在每次點擊前強制清空，確保不會有舊的殘留狀態汚染這一次新動畫。
    [...deck.querySelectorAll(':scope > .chead')].forEach(el => el.remove());
    cards.forEach(c => { const h = c.querySelector('.chead'); if (h) h.style.visibility = ''; });
    const prevPinned = pinned;
    pinned = (pinned === card) ? null : card;
    const newHero = pinned;
    const oldHero = (prevPinned && prevPinned !== pinned) ? prevPinned : null;
    // movers：真正做空間 FLIP 動畫的卡片。使用者要求「每張卡都真的動，允許互相交錯/重疊」，
    // 所以這裡不再區分主角/配角——四張卡全部都做 FLIP + 失焦模糊，只是主角的位移/縮放
    // 幅度通常最大（真正變大的那張），縮圖彼此之間可能只是換個排列順序，位移較小。
    const movers = cards;
    // chrome（標題副標＋KPI 列）只有在「有主角 ⇄ 沒有主角」這種轉場才需要收合/展開；
    // A→B 直接切換時 chrome 全程維持收合狀態，不用跟著再動一次。
    const chromeChanging = (!!prevPinned) !== (!!pinned);
    const toCompact = !!pinned;

    if (!animEnabled) {
      applyFrameLayout(pinned); applyContentState(pinned);
      cards.forEach(c => {
        c.style.transform = ''; c.style.opacity = ''; c.classList.remove('ghost', 'morphing');
        const b = c.querySelector('.cbody'); if (b) b.style.filter = '';
        const h = c.querySelector('.chead'); if (h) h.style.visibility = '';
      });
      headOverlay.innerHTML = '';
      topEl.style.opacity = ''; topEl.style.filter = ''; topEl.style.transition = '';
      kpisEl.style.opacity = ''; kpisEl.style.filter = ''; kpisEl.style.transition = '';
      return;
    }

    const first = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
    const headFirst = new Map(cards.map(c => [c, c.querySelector('.chead').getBoundingClientRect()]));
    applyFrameLayout(pinned); // 先套用「最終」grid 定位（含 chrome compact class），量到目的地座標
    const last = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
    const headLast = new Map(cards.map(c => [c, c.querySelector('.chead').getBoundingClientRect()]));
    // .deck 的畫面位置本來就會因為「chrome 收合/展開」而改變（chrome 變矮，.deck 在 flex 直排下
    // 會被推高）。但 frame() 逐幀動畫 chrome 尺寸時，用的是「從頭 lerp」的獨立數值，
    // 這段期間 chrome 的即時渲染尺寸不等於量測 last 當下（已經整個套用 compact）的尺寸，
    // 於是 .deck 這段期間的實際螢幕位置會偏離 last 假設的位置——卡片本身用 transform 位移，
    // 會被這個「意外的 deck 位移」帶著多跑一段，但標題疊層 clone 是用量到的『絕對螢幕座標』獨立
    // 定位，不受這個 deck 位移影響，兩者因此對不上。
    // 解法：動畫期間把 .deck 從 flex 排版中抽出來，用 position:fixed 釘死在 last 量到的那個畫面矩形，
    // chrome 尺寸怎麼動都不會再牽動 .deck 的實際位置。
    const deckLastRect = deck.getBoundingClientRect();
    const deckPrevStyle = deck.getAttribute('style') || '';

    // v3-reload-marker
    // 「格子（外框）平滑跟著 FLIP 縮放，但裡面的數字/字級是 CSS class 瞬間切換」——
    // 這裡把 is-pinned/is-thumb 會影響「字級」的幾個地方，同樣改成逐幀真實 font-size 插值，
    // 跟外框動畫共用同一個 eased，字才不會在動畫結束那一刻突然彈一下。
    const roleOf = (c) => (c === pinned ? 'pin' : (pinned ? 'thumb' : 'grid'));
    const roleOfPrev = (c) => (c === prevPinned ? 'pin' : (prevPinned ? 'thumb' : 'grid'));
    const FONT_SIZES = {
      ctitle: { grid: 14.5, pin: 14.5, thumb: 13 },
      amt:    { grid: 20,   pin: 26,   thumb: 15 },
      lab:    { grid: 11,   pin: 11,   thumb: 9 },
      big:    { grid: 20,   pin: 24,   thumb: 16 },
    };
    function fontLerpEntry(el, key, fromRole, toRole) {
      if (!el) return null;
      const from = FONT_SIZES[key][fromRole], to = FONT_SIZES[key][toRole];
      if (from === to) return null; // 這張卡這次角色沒變，不用插值
      return { el, from, to };
    }

    // 圖示尺寸（圓餅圖 svg / 交易圖示）也一起納入這套逐幀插值，不再靠 CSS class 瞬間切換：
    const SIZE_PX = {
      donutSvg: { grid: 128, pin: 128, thumb: 92 },
      txIcon:   { grid: 29,  pin: 29,  thumb: 26 },
    };
    function sizeLerpEntries(c, selector, sizeKey, fromRole, toRole) {
      const from = SIZE_PX[sizeKey][fromRole], to = SIZE_PX[sizeKey][toRole];
      if (from === to) return [];
      return [...c.querySelectorAll(selector)].map(el => ({ el, from, to }));
    }

    // 配角卡切到縮圖時，「多餘」的內容（圖例、第3筆以後交易、額外預算列）原本用 CSS
    // `display:none` 在動畫結束那一刻瞬間消失，跟外框已經平滑完成的縮放不同調、顯得突兀。
    // 這裡讓它們改成 opacity 淡出/淡入，跟外框動畫共用同一個進度，結束時才真正 display:none。
    function extraFadeEntries(c, fromRole, toRole) {
      const before = fromRole !== 'thumb', after = toRole !== 'thumb';
      if (before === after) return [];
      return [...c.querySelectorAll('.thumb-hide')].map(el => ({ el, from: before ? 1 : 0, to: after ? 1 : 0 }));
    }

    const moverData = movers.map(c => {
      const f = first.get(c), l = last.get(c);
      const hf = headFirst.get(c), hl = headLast.get(c);
      const realHead = c.querySelector('.chead');
      // 焦點卡（使用者這次點的那張，不管是變大還是縮小）壓在最上層；其他卡都同一層。
      const z = (c === card) ? 10 : 1;
      const clone = realHead.cloneNode(true);
      clone.style.cssText = 'position:fixed; margin:0; box-sizing:border-box;';
      clone.style.left = hf.left + 'px';
      clone.style.top = hf.top + 'px';
      clone.style.width = hf.width + 'px';
      clone.style.height = hf.height + 'px';
      clone.style.zIndex = String(z + 1); // 只比自己這張卡高一層（蓋過自己的卡身，不影響其他卡）
      deck.appendChild(clone); // 跟卡片同一個容器（不進獨立的高 z-index 疊層），z-index 才能跟卡片本身互相比較
      realHead.style.visibility = 'hidden'; // 版面空間保留，只是不畫出來，避免卡片內容跳動

      const fromRole = roleOfPrev(c), toRole = roleOf(c);
      const fontLerps = [
        fontLerpEntry(clone.querySelector('.ctitle'), 'ctitle', fromRole, toRole),
        fontLerpEntry(c.querySelector('.center .amt'), 'amt', fromRole, toRole),
        fontLerpEntry(c.querySelector('.center .lab'), 'lab', fromRole, toRole),
        fontLerpEntry(c.querySelector('.bud-total .big'), 'big', fromRole, toRole),
      ].filter(Boolean);
      const sizeLerps = [
        ...sizeLerpEntries(c, '.donut svg', 'donutSvg', fromRole, toRole),
        ...sizeLerpEntries(c, '.tx .ic', 'txIcon', fromRole, toRole),
      ];
      const extraFades = extraFadeEntries(c, fromRole, toRole);
      const skelOverlay = c.querySelector('.skel-overlay');
      const skelContent = c.querySelector('.skel-target');

      // 「主角」（這次變大或縮小成主角的那張）位移/縮放幅度通常遠大於縮圖列的其他卡。
      // 若全部共用同一條 eased 曲線，縮圖卡在實际像素上很快就接近終點、看起來像「提前定位完成」，
      // 主角卻還在明顯變大——造成「格子先縮完才放大」的錯覚。
      // 解法：非主角的卡用一條「落後」的曲線（eased​​^POW，0<POW<1時反而提前，>1時延後），
      // 讓它們的尺寸變化均匀地拖到接近整段動畫結束，與主角的視覚進度更接近。
      const isHero = (c === newHero) || (c === oldHero);

      return {
        card: c, first: f, last: l,
        dx: f.left - l.left, dy: f.top - l.top,
        sx0: (f.width / l.width) || 1, sy0: (f.height / l.height) || 1,
        realHead, clone, hf, hl, z, fontLerps, sizeLerps, extraFades, skelOverlay, skelContent, isHero,
        cbody: c.querySelector('.cbody'),
      };
    });

    cards.forEach(c => {
      c.classList.remove('ghost');
      c.classList.add('morphing');
      c.style.transition = 'none';
      c.style.opacity = '';
      c.style.transformOrigin = 'top left';
      c.style.zIndex = (c === card) ? '10' : '1'; // 焦點卡（使用者點的那張）壓在最上層，不管變大還是縮小
    });
    // 「查看完整 XX 頁」這个按鈕只有真正完全定位成主角後才應該出現：它現在是當卡片從主角開始變回縮圖時，
    // 依賴 applyContentState 只在動畫最後一刻才移除 is-pinned class，導致這個按鈕在整段縮小過程中都仍然顯示，
    // 只有最後一幀才突然消失——與「變化過程中不應出現」相反。這裡在動畫一開始就立即把它藏起來（不等到結束），
    // 真正變回主角時又會在動畫結束那一刻才自然出現（不受影響，因為它本來就只在 is-pinned 下顯示）。
    moverData.forEach(m => {
      const fromRole = roleOfPrev(m.card), toRole = roleOf(m.card);
      if (fromRole === 'pin' && toRole !== 'pin') {
        const fl = m.card.querySelector('.full-link');
        if (fl) fl.style.display = 'none';
      }
    });
    if (chromeChanging) {
      // chrome 也改進同一個 rAF 迴圈逐幀更新（不在動畫結束後另起一段獨立的 CSS transition），
      // 跟卡片本身的失焦曲線用同一個 eased，一定會在同一幀一起完成。
      topEl.style.transition = 'none'; kpisEl.style.transition = 'none';
      topEl.style.opacity = '.45'; kpisEl.style.opacity = '.45';
      // 把 .deck 釘死在量到的最終位置與尺寸，讓 chrome 尺寸逐幀變化時不會牽動 .deck 的實際位置，
      // 卡片的 transform 位移／縮放才會全程跟標題疊層 clone（用絕對螢幕座標）保持同步。
      deck.style.position = 'fixed';
      deck.style.left = deckLastRect.left + 'px';
      deck.style.top = deckLastRect.top + 'px';
      deck.style.width = deckLastRect.width + 'px';
      deck.style.height = deckLastRect.height + 'px';
    }    moverData.forEach(m => {
      m.card.style.transform = `translate(${m.dx}px,${m.dy}px) scale(${m.sx0},${m.sy0})`;
      if (m.cbody) { m.cbody.style.transition = 'none'; m.cbody.style.filter = 'blur(0px)'; }
    });

    animating = true;
    const durMs = flipDur * 1000;
    let start = null;

    function frame(ts) {
      if (start === null) start = ts;
      const raw = Math.min(1, (ts - start) / durMs);
      const eased = easeInOutSine(raw);
      // 失焦→對焦曲線：兩端為 0（清晰）、正中為峰值（最模糊），跟位移/縮放共用同一個 eased 值，
      // 保證「模糊最重的瞬間」正好是卡片移動最快的瞬間，觀感上像鏡頭在追蹤這個物件而暫時失焦。
      const HERO_LAG_POW = 1.7; // 非主角卡（縮圖列）的專屬進度曲線指數：>1 讓它們「故意落後」於全域 eased，
      // 尺寸變化延到動畫後段才追上，避免縮圖比主角早幾拍看起來「定位完成」。
      moverData.forEach(m => {
        const p = m.isHero ? eased : Math.pow(eased, HERO_LAG_POW);
        const focus = Math.sin(p * Math.PI); // 失焦曲線也跟著各自的進度走，模糊峰值對應各自視覺移動最快的瞬間
        const tx = m.dx * (1 - p), ty = m.dy * (1 - p);
        const sx = m.sx0 + (1 - m.sx0) * p, sy = m.sy0 + (1 - m.sy0) * p;
        m.card.style.transform = `translate(${tx}px,${ty}px) scale(${sx},${sy})`;
        // 標題疊層：純粹移動＋改變寬高（真實版面屬性），完全不用 scale，
        // 圓點/文字/圖示的字級與尺寸全程維持原生渲染，瀏覽器排版引擎自己把
        // 各元素「黏」在正確位置（例如釘選鈕靠右的 margin-left:auto 照樣生效）。
        const cx = m.hf.left + (m.hl.left - m.hf.left) * p;
        const cy = m.hf.top + (m.hl.top - m.hf.top) * p;
        const cw = m.hf.width + (m.hl.width - m.hf.width) * p;
        const ch = m.hf.height + (m.hl.height - m.hf.height) * p;
        m.clone.style.width = cw + 'px';
        m.clone.style.height = ch + 'px';
        m.clone.style.transform = `translate(${cx - m.hf.left}px, ${cy - m.hf.top}px)`;
        if (m.cbody) m.cbody.style.filter = `blur(${(focus * MORPH_BLUR).toFixed(2)}px)`;
        m.fontLerps.forEach(fl => { fl.el.style.fontSize = lerp(fl.from, fl.to, p).toFixed(2) + 'px'; });
        m.sizeLerps.forEach(sl => { const v = lerp(sl.from, sl.to, p).toFixed(2) + 'px'; sl.el.style.width = v; sl.el.style.height = v; });
        m.extraFades.forEach(fe => { fe.el.style.opacity = lerp(fe.from, fe.to, p).toFixed(2); });
        // 骨架佔位圖：模糊峰值那一刻真實內容淡出、骨架淡入，兩者相反相成，共用同一個 focus 曲線，
        // 結束時自然都回到 0/1，不會残留一定透明度。
        if (m.skelOverlay) {
          m.skelOverlay.style.opacity = (focus * 0.92).toFixed(2);
          if (m.skelContent) m.skelContent.style.opacity = (1 - focus * 0.92).toFixed(2);
        }
      });
      if (chromeChanging) {
        // chrome（標題/KPI）跟縮圖列同屬「壓縮/退場」的一群，套用同一條落後曲線，
        // 才不會跟縮圖卡一樣，比主角早收合完畢。
        const chromeP = Math.pow(eased, HERO_LAG_POW);
        const t = toCompact ? chromeP : (1 - chromeP); // 0=展開尺寸, 1=收合尺寸
        const chromeFocus = Math.sin(chromeP * Math.PI);
        topEl.style.opacity = String(0.45 + 0.55 * chromeP);
        topEl.style.filter = `blur(${(chromeFocus * MORPH_BLUR).toFixed(2)}px)`;
        kpisEl.style.opacity = topEl.style.opacity;
        kpisEl.style.filter = topEl.style.filter;
        // 真實版面屬性插值（不是 transform scale）：標題字級/KPI padding/間距真的逐幀縮小，
        // 文字不會因為 scale 而模糊。
        topEl.style.marginBottom = lerp(13, 6, t) + 'px';
        h1El.style.fontSize = lerp(21, 16, t) + 'px';
        subEl.style.opacity = lerp(1, 0, t);
        subEl.style.maxHeight = lerp(40, 0, t) + 'px';
        subEl.style.marginTop = lerp(3, 0, t) + 'px';
        kpisEl.style.gap = lerp(12, 8, t) + 'px';
        kpisEl.style.marginBottom = lerp(13, 8, t) + 'px';
        kpiEls.forEach(k => {
          k.style.padding = lerp(11, 6, t).toFixed(1) + 'px ' + lerp(15, 12, t).toFixed(1) + 'px';
          const kl = k.querySelector('.kl'), kv = k.querySelector('.kv');
          if (kl) { kl.style.marginBottom = lerp(6, 1, t).toFixed(1) + 'px'; kl.style.fontSize = lerp(12, 10, t).toFixed(1) + 'px'; }
          if (kv) kv.style.fontSize = lerp(19, 14, t).toFixed(1) + 'px';
        });
      }
      if (raw < 1) { requestAnimationFrame(frame); return; }

      moverData.forEach(m => {
        m.card.style.transform = ''; m.card.style.transformOrigin = ''; m.card.classList.remove('morphing');
        m.card.style.zIndex = '';
        if (m.cbody) { m.cbody.style.filter = ''; m.cbody.style.transition = ''; }
        m.fontLerps.forEach(fl => { fl.el.style.fontSize = ''; }); // 交給對應的 is-pinned/is-thumb CSS 規則接手，數值本來就一致
        m.sizeLerps.forEach(sl => { sl.el.style.width = ''; sl.el.style.height = ''; });
        m.extraFades.forEach(fe => { fe.el.style.opacity = ''; }); // 交給 .is-thumb .thumb-hide 的 display:none 接手
        if (m.skelOverlay) m.skelOverlay.style.opacity = '';
        if (m.skelContent) m.skelContent.style.opacity = '';
        m.clone.remove();
        const fl = m.card.querySelector('.full-link');
        if (fl) fl.style.display = ''; // 交給 .is-pinned .full-link 的 CSS 規則接手
        m.realHead.style.visibility = '';
      });
      if (chromeChanging) {
        topEl.style.opacity = ''; topEl.style.filter = ''; topEl.style.marginBottom = '';
        h1El.style.fontSize = '';
        subEl.style.opacity = ''; subEl.style.maxHeight = ''; subEl.style.marginTop = '';
        kpisEl.style.opacity = ''; kpisEl.style.filter = ''; kpisEl.style.gap = ''; kpisEl.style.marginBottom = '';
        kpiEls.forEach(k => {
          k.style.padding = '';
          const kl = k.querySelector('.kl'), kv = k.querySelector('.kv');
          if (kl) { kl.style.marginBottom = ''; kl.style.fontSize = ''; }
          if (kv) kv.style.fontSize = '';
        });
        deck.setAttribute('style', deckPrevStyle); // 解除釘死，交還給 flex 版面自然決定位置
      }
      applyContentState(pinned);
      animating = false;
    }
    requestAnimationFrame(frame);
  }

  cards.forEach(card => {
    card.addEventListener('click', (e) => {
      const link = e.target.closest('.full-link');
      if (link) { e.stopPropagation(); showToast(link.dataset.nav); return; }
      togglePin(card);
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePin(card); }
    });
  });
  document.getElementById('reset').addEventListener('click', () => { if (pinned) togglePin(pinned); });

  const animBtn = document.getElementById('anim');
  animBtn.addEventListener('click', () => {
    if (animating) return;
    animEnabled = !animEnabled;
    animBtn.lastChild.textContent = animEnabled ? '動畫 開' : '動畫 關';
  });

  const speedBtn = document.getElementById('speed');
  const MULTS = [1, 2, 4];
  let speedMult = 1;
  speedBtn.addEventListener('click', () => {
    speedMult = MULTS[(MULTS.indexOf(speedMult) + 1) % MULTS.length];
    flipDur = 0.4 * speedMult;
    speedBtn.lastChild.textContent = `慢動作 ${speedMult}×`;
  });

  const toastEl = document.getElementById('toast');
  let toastT;
  function showToast(nav) {
    toastEl.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg> 正式版會導向「${nav}」頁`;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
</script>
</body>
</html>

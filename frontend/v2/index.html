<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記帳 App</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <!-- 啟動畫面：純 CSS、寫在這裡才能比 JS 更早顯示；main.js 的 boot() 完成後淡出（hideSplash） -->
  <style>
    #splash { position:fixed; inset:0; z-index:100000; display:flex; align-items:center; justify-content:center; background:var(--bg,#f5f5f7); pointer-events:none; transition:opacity .28s ease; }
    #splash.hide { opacity:0; }
    #splash svg.sp { width:200px; height:200px; }
    /* 外圈：淡淡的底環＋一段持續旋轉的弧線 */
    .sp-track { stroke:var(--border,#d0d4da); opacity:.5; }
    .sp-ring { stroke:var(--accent,#1f6feb); transform-origin:120px 120px; animation:sp-spin 1s linear infinite; }
    @keyframes sp-spin { to { transform:rotate(360deg); } }
    /* 中間圖案：各零件依序飛進來「合體」，約 1.4 秒；結束後保持完整圖案（forwards），外圈繼續轉到 App 準備好 */
    .sp-bg { transform-box:fill-box; transform-origin:center; animation:sp-pop .4s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes sp-pop { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:none; } }
    .sp-book { animation:sp-rise .5s cubic-bezier(.2,.9,.3,1.1) .2s both; }
    @keyframes sp-rise { from { opacity:0; transform:translateY(140px); } to { opacity:1; transform:none; } }
    .sp-line { transform-box:fill-box; transform-origin:left center; animation:sp-draw .26s ease-out both; }
    .sp-l1 { animation-delay:.55s; } .sp-l2 { animation-delay:.65s; } .sp-l3 { animation-delay:.75s; }
    @keyframes sp-draw { from { transform:scaleX(0); } to { transform:none; } }
    .sp-coin { animation:sp-drop .55s cubic-bezier(.3,0,.4,1) .8s both; }
    @keyframes sp-drop { 0% { opacity:0; transform:translateY(-340px); } 55% { opacity:1; transform:translateY(26px); } 78% { transform:translateY(-12px); } 100% { opacity:1; transform:none; } }
    .sp-pencil { animation:sp-slide .45s cubic-bezier(.2,.9,.3,1.1) 1s both; }
    @keyframes sp-slide { from { opacity:0; transform:translate(280px,280px); } to { opacity:1; transform:none; } }
    /* 減少動態效果：直接顯示完整圖案、外圈不轉 */
    @media (prefers-reduced-motion:reduce) { #splash { transition:none; } .sp-ring, .sp-bg, .sp-book, .sp-line, .sp-coin, .sp-pencil { animation:none; } }
  </style>
  <script>
    // 在 CSS 變數生效前先套好主題，避免暗色使用者先閃一下亮色底（theme.js 稍後會再套一次，結果相同）
    try {
      var pref = localStorage.getItem('v2-theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用：維持預設亮色 */ }
    // 保險：萬一 main.js 載入失敗，12 秒後自動拿掉啟動畫面，不要永遠蓋住錯誤
    setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 12000);
  </script>
</head>
<body>
  <!-- 圖案零件取自 icon.svg（座標系 1024），拆成可各自動畫的群組；改圖示時這裡要一起更新 -->
  <div id="splash" aria-hidden="true">
    <svg class="sp" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <circle class="sp-track" cx="120" cy="120" r="108" fill="none" stroke-width="6"/>
      <circle class="sp-ring" cx="120" cy="120" r="108" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="170 509"/>
      <svg x="36" y="36" width="168" height="168" viewBox="0 0 1024 1024">
        <clipPath id="sp-clip"><rect width="1024" height="1024" rx="230"/></clipPath>
        <g clip-path="url(#sp-clip)">
          <rect class="sp-bg" width="1024" height="1024" fill="#1f6feb"/>
          <g transform="translate(512 512) scale(.84) translate(-512 -512)">
            <g class="sp-book">
              <rect x="312" y="252" width="400" height="520" rx="48" fill="#fff"/>
              <path d="M312 300 a48 48 0 0 1 48-48 H410 V772 H360 a48 48 0 0 1-48-48 Z" fill="#b9d3fa"/>
            </g>
            <rect class="sp-line sp-l1" x="464" y="400" width="188" height="60" rx="30" fill="#1f6feb"/>
            <rect class="sp-line sp-l2" x="464" y="508" width="188" height="60" rx="30" fill="#1f6feb"/>
            <rect class="sp-line sp-l3" x="464" y="616" width="112" height="60" rx="30" fill="#1f6feb"/>
            <g class="sp-pencil">
              <g transform="translate(672 650) rotate(45)">
                <path d="M-54 -200 H54 V120 L0 210 L-54 120 Z" fill="#0b3d91" stroke="#1f6feb" stroke-width="34" stroke-linejoin="round" paint-order="stroke"/>
                <path d="M-54 -200 H54 V-120 H-54 Z" fill="#8bb6f7"/>
              </g>
            </g>
            <g class="sp-coin">
              <circle cx="650" cy="300" r="105" fill="#8bb6f7" stroke="#1f6feb" stroke-width="30" paint-order="stroke"/>
              <g transform="translate(650 300) scale(.37)" fill="none" stroke="#0b3d91" stroke-width="64" stroke-linecap="round">
                <path d="M0 -150 V150"/>
                <path d="M96 -76 C96 -124 52 -150 0 -150 C-56 -150 -96 -124 -96 -80 C-96 -36 -56 -20 0 -4 C56 12 96 32 96 76 C96 124 56 150 0 150 C-56 150 -96 124 -96 80"/>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </svg>
  </div>
  <div id="app"></div>
  <!-- jsQR：電子發票 QR 掃描（免 AppID、純前端）。classic script 先於 module 執行，window.jsQR 就緒 -->
  <script src="./vendor/jsqr.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>

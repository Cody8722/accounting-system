<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記帳 App</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <!-- 啟動畫面：純 CSS、寫在這裡才能比 JS 更早顯示；main.js 的 boot() 完成後淡出（hideSplash） -->
  <style>
    #splash { position:fixed; inset:0; z-index:100000; display:flex; align-items:center; justify-content:center; background:var(--bg,#f5f5f7); pointer-events:none; transition:opacity .28s ease; }
    #splash.hide { opacity:0; }
    #splash img.sp { display:block; width:200px; height:200px; border-radius:22.5%; }
    /* 減少動態效果：不淡出；SMIL 動畫由 body 內的 script 直接跳到最後一格 */
    @media (prefers-reduced-motion:reduce) { #splash { transition:none; } }
  </style>
  <script>
    // 在 CSS 變數生效前先套好主題，避免暗色使用者先閃一下亮色底（theme.js 稍後會再套一次，結果相同）
    try {
      var pref = localStorage.getItem('v2-theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用：維持預設亮色 */ }
    // 保險：萬一 main.js 載入失敗，12 秒後自動拿掉啟動畫面，不要永遠蓋住錯誤
    setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 12000);
  </script>
</head>
<body>
  <!-- 啟動動畫：Claude Design 做的 SMIL 動畫（splash.svg，2.0 秒，播一次，最後一格＝icon.svg）。
       用 <img> 載入：SVG 圖片有自己的時間軸，不必等整頁 load（內嵌 SVG 要等 load 才開始跑，網路慢時動畫會被跳過）。
       改動畫長度時 main.js 的 SPLASH_ANIM_MS 要一起調。 -->
  <div id="splash" aria-hidden="true">
    <img class="sp" src="./splash.svg" alt="" width="200" height="200" onload="window.__splashT=performance.now()">
  </div>
  <script>
    // 減少動態效果：SMIL 不吃 CSS media query，改放不會動的 icon.svg
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('#splash img').src = './icon.svg'; } catch (e) { /* 略過 */ }
  </script>
  <div id="app"></div>
  <!-- jsQR：電子發票 QR 掃描（免 AppID、純前端）。classic script 先於 module 執行，window.jsQR 就緒 -->
  <script src="./vendor/jsqr.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>

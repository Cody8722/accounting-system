<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記帳 App</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <!-- 啟動畫面：純 CSS、寫在這裡才能比 JS 更早顯示；main.js 的 boot() 完成後淡出（hideSplash） -->
  <style>
    #splash { position:fixed; inset:0; z-index:100000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:var(--bg,#f5f5f7); pointer-events:none; transition:opacity .28s ease; }
    #splash.hide { opacity:0; }
    #splash img { width:96px; height:96px; border-radius:22px; box-shadow:0 10px 30px rgba(31,111,235,.28); animation:splash-pulse 1.6s ease-in-out infinite; }
    #splash span { font-size:15px; font-weight:600; letter-spacing:.12em; color:var(--muted,#6b7280); }
    @keyframes splash-pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
    @media (prefers-reduced-motion:reduce) { #splash img { animation:none; } #splash { transition:none; } }
  </style>
  <script>
    // 在 CSS 變數生效前先套好主題，避免暗色使用者先閃一下亮色底（theme.js 稍後會再套一次，結果相同）
    try {
      var pref = localStorage.getItem('v2-theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用：維持預設亮色 */ }
    // 保險：萬一 main.js 載入失敗，12 秒後自動拿掉啟動畫面，不要永遠蓋住錯誤
    setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 12000);
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="./icon.svg" alt=""><span>記帳</span></div>
  <div id="app"></div>
  <!-- jsQR：電子發票 QR 掃描（免 AppID、純前端）。classic script 先於 module 執行，window.jsQR 就緒 -->
  <script src="./vendor/jsqr.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>

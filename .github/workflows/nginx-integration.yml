name: Nginx Integration

# 透過 nginx proxy 這一層做路由冒煙測試（有別於直連 backend 的單元/E2E）。
# 在 CI 內完整重現「同域雙環境」部署：proxy + 正式(前後端) + 測試(前後端) + MongoDB，
# 用自簽憑證跑 HTTPS，再以 curl 驗證 / 與 /test/ 的路由及 /test 前綴剝除。
#
# 僅在改動 nginx 設定 / compose / 本工作流程 / 冒煙腳本時觸發，避免拖慢主流程。

on:
  push:
    branches: [develop, release]
    paths:
      - 'nginx*.conf'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'backend/Dockerfile'
      - 'scripts/ci/nginx-smoke.sh'
      - '.github/workflows/nginx-integration.yml'
  pull_request:
    branches: [develop, release]
    paths:
      - 'nginx*.conf'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'backend/Dockerfile'
      - 'scripts/ci/nginx-smoke.sh'
      - '.github/workflows/nginx-integration.yml'
  workflow_dispatch:

jobs:
  nginx-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # compose 檔以 external 參照 edge / shared-db，CI 需先手動建立
      - name: 建立外部 Docker 網路（edge / shared-db）
        run: |
          docker network create edge
          docker network create shared-db

      # 拋棄式 MongoDB：無認證，名為 mongodb（backend 以此名稱經 shared-db 解析）
      - name: 啟動 MongoDB
        run: docker run -d --name mongodb --network shared-db mongo:7

      # 自簽憑證：SAN 含 localhost；檔名對齊 nginx-https.conf 寫死的 ts.net 路徑
      - name: 產生自簽憑證
        run: |
          CERT_DIR="$HOME/nginx/certs"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$CERT_DIR/ubuntu-server.tail886591.ts.net.key" \
            -out    "$CERT_DIR/ubuntu-server.tail886591.ts.net.crt" \
            -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:ubuntu-server.tail886591.ts.net,IP:127.0.0.1"

      # 主 docker-compose.yml 是通用版（自帶埠對外、內建網路）；雙環境部署的差異由「本機覆蓋檔」
      # docker-compose.override.yml 提供（該檔被 gitignore，不進版控）。CI 在此臨時產生等效內容。
      - name: 產生雙環境覆蓋檔（接 edge / shared-db、不對外開埠）
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            backend:
              ports: !reset []
              networks:
                - shared-db
                - edge
            frontend:
              ports: !reset []
              networks:
                - edge
          networks:
            shared-db:
              external: true
            edge:
              external: true
          EOF

      # 正式與測試共用同一份 compose 變數 MONGO_URI，以行內環境變數分別指定資料庫名
      - name: 啟動正式環境（/ → accounting_db）
        run: MONGO_URI=mongodb://mongodb:27017/accounting_db docker compose -p accounting up -d --build

      - name: 啟動測試環境（/test/ → accounting_db_test）
        run: MONGO_URI=mongodb://mongodb:27017/accounting_db_test docker compose -p accounting-test -f docker-compose.test.yml up -d --build

      - name: 啟動 HTTPS proxy
        run: docker compose -p accounting-proxy -f docker-compose.proxy.yml up -d

      # 須等「兩個」後端都就緒：正式後端啟動早於測試後端，只等 /health 會漏掉測試後端
      # （測試後端未就緒時 /test/api/... 會回 502）。故同時 gate 正式 /health 與測試 401。
      - name: 等待正式與測試後端就緒
        run: |
          ready() {
            local code
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$1" || true)"
            [ "$code" = "$2" ]
          }
          for i in $(seq 1 60); do
            if ready https://localhost/health 200 \
               && ready https://localhost/test/api/auth/verify 401; then
              echo "正式與測試後端皆就緒（第 $i 次嘗試）"
              exit 0
            fi
            echo "等待中… ($i/60)"
            sleep 3
          done
          echo "逾時：後端未在時限內就緒"
          exit 1

      - name: 執行 nginx 冒煙測試
        run: bash scripts/ci/nginx-smoke.sh https://localhost

      # 失敗時輸出各容器日誌以利除錯
      - name: 輸出容器日誌（僅失敗時）
        if: failure()
        run: |
          for c in accounting-proxy accounting-backend accounting-frontend \
                   accounting-backend-test accounting-frontend-test mongodb; do
            echo "===================== $c ====================="
            docker logs "$c" 2>&1 || echo "(無法取得 $c 日誌)"
          done

      - name: 清理
        if: always()
        # down 時 compose 仍會展開 environment 區塊，給 dummy MONGO_URI 避免必填變數報錯
        env:
          MONGO_URI: mongodb://mongodb:27017/dummy
        run: |
          docker compose -p accounting-proxy -f docker-compose.proxy.yml down || true
          docker compose -p accounting-test -f docker-compose.test.yml down || true
          docker compose -p accounting down || true
          docker rm -f mongodb || true
          docker network rm edge shared-db || true
          rm -f docker-compose.override.yml

  # 通用快速開始：照 README／docker-compose.yml 註解的步驟，在乾淨環境一行跑起來
  # （內建 MongoDB、前端 8080、後端 5001）。換環境能不能快速架設，就靠這個 job 守著。
  generic-quickstart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 準備設定檔（照快速開始步驟）
        run: |
          cp backend/.env.example backend/.env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-$(openssl rand -hex 16)|" backend/.env
          cp .env.example .env

      - name: 啟動（docker compose up -d --build）
        run: docker compose up -d --build

      - name: 等待後端與前端就緒
        run: |
          for i in $(seq 1 60); do
            b="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:5001/health || true)"
            f="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ || true)"
            if [ "$b" = "200" ] && [ "$f" = "200" ]; then
              echo "後端與前端皆就緒（第 $i 次嘗試）"
              exit 0
            fi
            echo "等待中… ($i/60) backend=$b frontend=$f"
            sleep 3
          done
          echo "逾時：未在時限內就緒"
          exit 1

      - name: 後端確實連上資料庫（登入端點回 401 而非 5xx）
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:5001/api/auth/verify || true)"
          [ "$code" = "401" ] || { echo "預期 401，實得 $code"; exit 1; }

      - name: 輸出容器日誌（僅失敗時）
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true

      - name: 清理
        if: always()
        run: docker compose down -v || true
